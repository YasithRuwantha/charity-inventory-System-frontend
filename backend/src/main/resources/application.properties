spring.application.name=charity-management-back

# ── Database ──────────────────────────────────────────────────────────────────
# One MySQL schema backs the whole system: charity_db
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:charity_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:charity_user}
spring.datasource.password=${DB_PASSWORD:Charity@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# "update" only adds missing tables/columns — it never drops existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── JWT ───────────────────────────────────────────────────────────────────────
# 256-bit Base64-encoded secret key (override with an env var in production!)
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity: 24 hours (in milliseconds)
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Business rules ────────────────────────────────────────────────────────────
# Window used to warn that a beneficiary already received the same item recently.
charity.distribution.duplicate-days=30
# Horizon for "expiring soon" queries and dashboard alerts.
charity.inventory.expiring-soon-days=30
charity.organization.name=Charity Inventory Management System
charity.organization.address=
charity.organization.contact=
# Comma-separated list, or * to allow any origin.
charity.cors.allowed-origins=*
# Seed the default inventory categories on first start (existing rows are never touched).
charity.seed.default-categories=true

# ── File uploads (bulk donation import) ───────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── API documentation ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ── Health checks ─────────────────────────────────────────────────────────────
# Only health is exposed; the remaining actuator endpoints stay off.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] --- [%15.15t] %-40.40logger{39} : %m%n
logging.level.com.charitymanagement.api=INFO
