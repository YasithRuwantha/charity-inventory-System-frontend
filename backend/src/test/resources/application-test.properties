# Test profile only. Production runs on MySQL/charity_db with ddl-auto=update; the suite uses an
# in-memory H2 schema so it never touches — and can never drop — real data.
spring.datasource.url=jdbc:h2:mem:charity_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Tests create the categories they need, so the seeder stays out of the way.
charity.seed.default-categories=false
charity.distribution.duplicate-days=30
charity.inventory.expiring-soon-days=30
charity.organization.name=Test Charity

application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

logging.level.com.charitymanagement.api=WARN
logging.level.org.hibernate=WARN
